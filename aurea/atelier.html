<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurea — atelier des modèles</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1c1a17;
        font-family: Georgia, "Times New Roman", serif;
      }
      #ecran {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .etiquette {
        position: absolute;
        transform: translate(-50%, -100%);
        color: #fbf3df;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
        pointer-events: none;
      }
      .etiquette small {
        opacity: 0.7;
        font-size: 10px;
      }
      #infos {
        position: absolute;
        left: 12px;
        bottom: 10px;
        color: #e8dcc0;
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <canvas id="ecran"></canvas>
    <div id="etiquettes"></div>
    <div id="infos"></div>
    <script type="module" src="/src/atelier.ts"></script>
  </body>
</html>
